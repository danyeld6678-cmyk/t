<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio do Dia</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="emoji">💌</div>

            <h1>Desafio do Dia</h1>

            <p>Um pequeno desafio pode mudar o seu dia.</p>

            <div class="desafio">
                <h2>Seu desafio:</h2>

                <p id="textoDesafio">
                    Mande uma mensagem para alguém de quem você gosta. ❤️
                </p>
            </div>

            <button id="botaoDesafio">
                🎲 Novo desafio
            </button>
            
            <button id="botaoConcluir">
                ✅ Concluir desafio
            </button>

            <p class="pontos">
                Pontos: <span id="pontos">0</span> ⭐
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
